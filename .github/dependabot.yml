version: 2

updates:
  # Only dev dependencies ever move: the runtime requirements are frozen by ADR-008.
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development

  # php-cs-fixer has its own manifest under tools/php-cs-fixer, outside require-dev.
  - package-ecosystem: composer
    directory: "/tools/php-cs-fixer"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
